[project]
name = "eco-policy-mcp"
version = "0.1.0"
description = "MCP server for Indian finance data: mutual-fund NAVs, GST & income-tax calculators, RBI policy rates, NSE/BSE market data — with provenance on every value. Works with any MCP client."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eco Policy MCP contributors" }]
keywords = ["mcp", "model-context-protocol", "india", "finance", "mutual-funds", "nav", "gst", "rbi", "nse", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastmcp>=2.3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/eco-policy-mcp/eco-policy-mcp"
Issues = "https://github.com/eco-policy-mcp/eco-policy-mcp/issues"

[project.scripts]
eco-policy-mcp = "eco_policy_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eco_policy_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
