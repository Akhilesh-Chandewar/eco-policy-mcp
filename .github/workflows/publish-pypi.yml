name: Publish to PyPI

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  id-token: write  # OIDC federated credential for PyPI Trusted Publishing

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
